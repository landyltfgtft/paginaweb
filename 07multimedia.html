        <h3>EJEMPLO CANVAS</h3>
        <!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Juego Canvas Reinicio</title>
  <style>
    canvas {
      border: 2px solid black;
      background: #f0f0f0;
      display: block;
      margin: auto;
    }
    #info {
      text-align: center;
      font-family: Arial, sans-serif;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="600" height="400"></canvas>
  <div id="info">Usa las flechas para moverte y clic para disparar</div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let player, bullets, enemies, keys, gameOver;

    function initGame() {
      player = { x: 300, y: 200, r: 20, speed: 5, color: "blue" };
      bullets = [];
      enemies = [];
      keys = {};
      gameOver = false;
    }

    initGame();

    document.addEventListener("keydown", e => keys[e.key] = true);
    document.addEventListener("keyup", e => keys[e.key] = false);

    canvas.addEventListener("click", e => {
      if (gameOver) {
        initGame(); // Reinicia el juego
        return;
      }

      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;
      const dx = mouseX - player.x;
      const dy = mouseY - player.y;
      const angle = Math.atan2(dy, dx);

      bullets.push({
        x: player.x,
        y: player.y,
        r: 5,
        speed: 7,
        dx: Math.cos(angle),
        dy: Math.sin(angle),
        color: "red"
      });
    });

    function spawnEnemy() {
      if (gameOver) return;
      const side = Math.floor(Math.random() * 4);
      let x, y;
      if (side === 0) { x = 0; y = Math.random() * canvas.height; }
      else if (side === 1) { x = canvas.width; y = Math.random() * canvas.height; }
      else if (side === 2) { x = Math.random() * canvas.width; y = 0; }
      else { x = Math.random() * canvas.width; y = canvas.height; }

      enemies.push({ x, y, r: 15, speed: 2, color: "green" });
    }

    setInterval(spawnEnemy, 2000);

    function update() {
      if (gameOver) return;

      if (keys["ArrowUp"]) player.y -= player.speed;
      if (keys["ArrowDown"]) player.y += player.speed;
      if (keys["ArrowLeft"]) player.x -= player.speed;
      if (keys["ArrowRight"]) player.x += player.speed;

      bullets.forEach(b => {
        b.x += b.dx * b.speed;
        b.y += b.dy * b.speed;
      });

      enemies.forEach(e => {
        const dx = player.x - e.x;
        const dy = player.y - e.y;
        const angle = Math.atan2(dy, dx);
        e.x += Math.cos(angle) * e.speed;
        e.y += Math.sin(angle) * e.speed;
      });

      // Colisiones proyectil-enemigo
      for (let i = enemies.length - 1; i >= 0; i--) {
        for (let j = bullets.length - 1; j >= 0; j--) {
          const dx = enemies[i].x - bullets[j].x;
          const dy = enemies[i].y - bullets[j].y;
          const dist = Math.sqrt(dx*dx + dy*dy);
          if (dist < enemies[i].r + bullets[j].r) {
            enemies.splice(i, 1);
            bullets.splice(j, 1);
            break;
          }
        }
      }

      // Colisión enemigo-jugador
      for (let e of enemies) {
        const dx = e.x - player.x;
        const dy = e.y - player.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < e.r + player.r) {
          gameOver = true;
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = player.color;
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
      ctx.fill();

      bullets.forEach(b => {
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
      });

      enemies.forEach(e => {
        ctx.fillStyle = e.color;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
        ctx.fill();
      });

      if (gameOver) {
        ctx.fillStyle = "black";
        ctx.font = "40px Arial";
        ctx.fillText("GAME OVER", canvas.width/2 - 100, canvas.height/2);
        ctx.font = "20px Arial";
        ctx.fillText("Haz clic para reiniciar", canvas.width/2 - 90, canvas.height/2 + 40);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
