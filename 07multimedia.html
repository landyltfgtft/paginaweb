    <h3>EJEMPLO VIDEO CON SUBTITULOS</h3>
    <video width="640" height="360" controls loop poster="img/tim.jpg">
  <source src="archivos/taylor2.mp4" type="video/mp4">
  <track src="archivos/subtitulos.vtt" kind="subtitles" srclang="es" label="Español" default>
</video>

        <h3>EJEMPLO IMAGEN CON RUTA RELATIVA</h3>
        <img src="img/tim.jpg" alt="TIM BERNES LEE" width="400" height="300" border="10px">

        <img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d1/Tim_Berners-Lee_at_the_2025_Web_Summit_%28Cropped%29.jpg/1280px-Tim_Berners-Lee_at_the_2025_Web_Summit_%28Cropped%29.jpg?utm_source=en.wikipedia.org&utm_campaign=imageinfo&utm_content=thumbnail" alt="Tim Berners-Lee" width="400" height="300">

<embed src="archivos/taylor.swf" width="400" height="300" type="application/x-shockwave-flash">
