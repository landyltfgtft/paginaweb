<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Formulario Completo</title>
</head>
<body>
  <h1>Registro de Usuario</h1>

  <form action="procesar.php" method="post">
    
    <!-- Sección de datos personales -->
    <fieldset>
      <legend>Datos personales</legend>
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" name="nombre" required><br><br>

      <label for="edad">Edad:</label>
      <input type="number" id="edad" name="edad" min="1" max="120"><br><br>

      <label for="sexo">Sexo:</label>
      <select id="sexo" name="sexo">
        <option value="masculino">Masculino</option>
        <option value="femenino">Femenino</option>
        <option value="otro">Otro</option>
      </select>
    </fieldset>

    <!-- Sección de contacto -->
    <fieldset>
      <legend>Información de contacto</legend>
      <label for="email">Correo electrónico:</label>
      <input type="email" id="email" name="email" required><br><br>

      <label for="telefono">Teléfono:</label>
      <input type="tel" id="telefono" name="telefono">
    </fieldset>

    <!-- Sección de preferencias -->
    <fieldset>
      <legend>Preferencias</legend>
      <label>
        <input type="checkbox" name="suscripcion" value="boletin">
        Suscribirme al boletín
      </label><br>

      <label>
        <input type="radio" name="contacto" value="email" checked>
        Prefiero contacto por correo
      </label><br>

      <label>
        <input type="radio" name="contacto" value="telefono">
        Prefiero contacto por teléfono
      </label>
    </fieldset>

    <!-- Botones -->
    <button type="submit">Enviar</button>
    <button type="reset">Limpiar</button>
  </form>
</body>
</html>
